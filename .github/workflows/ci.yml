name: Submarine CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run unit tests and standalone javac check
        run: mvn -B test

      - name: Run league pre-flight check
        run: mvn -B -Pcheck
